<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <title>Returning to Vertesia App Builder</title>
        <link rel="stylesheet" href="./relay.css" />
        <script type="module" src="./relay.js"></script>
    </head>
    <body>
        <main id="relay" class="relay" aria-live="polite" aria-busy="true">
            <div class="brand" aria-label="Vertesia">
                <img
                    id="brand-mark"
                    class="brand-mark is-loading"
                    src="./vertesia-app-builder-icon.png"
                    alt=""
                    aria-hidden="true"
                />
                <span>vertesia</span>
            </div>
            <h1 id="title">Returning to App Builder</h1>
            <p id="message">Completing the GitHub connection.</p>
            <button id="close" type="button" hidden>Close</button>
        </main>
    </body>
</html>
